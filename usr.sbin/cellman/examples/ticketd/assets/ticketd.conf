{
  "server": {
    "addr": ":8080",
    "base_url": "",
    "session_key": "change-this-to-a-long-random-secret-min-32-chars",
    "session_timeout_minutes": 2880,
    "tls": false,
    "tls_cert": "",
    "tls_key": "",
    "tls_self_signed": false,
    "tls_self_signed_dir": "data/tls",
    "logo_file": "/opt/ticketd/ticketd-logo.svg",
    "info_url": ""
  },
  "metrics": {
    "addr": ":9090"
  },
  "db_url": "sqlite:////var/ticketd/ticketd.db",
  "db_busy_timeout_ms": 5000,
  "storage": {
    "base_path": "/var/ticketd"
  },
  "auth": {
    "password_pepper": "change-this-too"
  },
  "api": {
    "tokens": [
      {
        "value": "replace-with-long-random-api-token-min-32-chars",
        "label": "integration-readonly",
        "scopes": ["health:read", "ticket:read"],
        "expires_at": "2026-12-31T23:59:59Z",
        "audit": true
      }
    ]
  },
  "ingress": {
    "strict_mode": false,
    "unknown_folder": "INBOX.Unknown"
  },
  "system_mail": {
    "format": "html",
    "brand_name": "NeoBSD",
    "from_address": "noreply@neobsd.com",
    "signature": "Best regards\nNeoBSD Team"
  },
  "customer_access": {
    "enabled": true,
    "magic_link_ttl_minutes": 20,
    "chat_session_hours": 336,
    "chat_session_max_hours": 720,
    "pin_attempts": 5
  },
  "mailboxes": [
    {
      "name": "Support",
      "enabled": true,
      "imap_host": "",
      "imap_port": 993,
      "imap_username": "",
      "imap_password": "",
      "inbox_folder": "INBOX",
      "sent_folder": "INBOX.Sent",
      "import_sent_folder": true,
      "smtp_host": "",
      "smtp_port": 587,
      "smtp_username": "",
      "smtp_password": "",
      "mailbox_address": "",
      "poll_interval_seconds": 30,
      "ack_enabled": true,
      "rewrite_enabled": true,
      "rewrite_target_folder": "INBOX",
      "rewrite_delete_original": true,
      "rewrite_archive_original": false,
      "rewrite_archive_folder": "Archive",
      "rewrite_preserve_flags": true,
      "rewrite_preserve_internal_date": true,
      "rewrite_add_headers": true
    }
  ]
}
