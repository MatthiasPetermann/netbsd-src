<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cellman web sample</title>
  <style>
    body {
      margin: 0;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(140deg, #f6fbff, #f3fff9);
      color: #1b2733;
    }

    .card {
      width: min(620px, 92vw);
      background: #fff;
      border: 1px solid #d7e6dc;
      border-radius: 12px;
      padding: 1.1rem 1.2rem;
      box-shadow: 0 8px 24px rgba(30, 64, 47, 0.08);
    }
  </style>
</head>
<body>
  <section class="card">
    <h1>Hello from the web sample cell</h1>
    <p>Your declarative apply plan rendered this page successfully.</p>
  </section>
</body>
</html>
