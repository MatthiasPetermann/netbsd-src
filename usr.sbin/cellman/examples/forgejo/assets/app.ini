APP_NAME = cellman forgejo example
RUN_MODE = prod
RUN_USER = root

[server]
PROTOCOL = http
HTTP_ADDR = 0.0.0.0
HTTP_PORT = 3000
DOMAIN = forgejo.local
ROOT_URL = http://forgejo.local:3000/
DISABLE_SSH = true
START_SSH_SERVER = false

[database]
DB_TYPE = sqlite3
PATH = /var/lib/forgejo/data/forgejo.db

[repository]
ROOT = /var/lib/forgejo/data/git/repositories

[security]
INSTALL_LOCK = false
