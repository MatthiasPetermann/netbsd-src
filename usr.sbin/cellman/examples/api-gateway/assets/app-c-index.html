<!doctype html>
<html lang="en">

  <title>api-gateway-c</title>
  <style>
    body {
      margin: 0;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;

      color: #1d1830;

      background: #e5ddfb;

      border-radius: 999px;
      padding: .2rem .55rem;
      font-size: .84rem;
    }

<body>
  <section class="card">
    <span class="tag">service c</span>
    <h1>API Gateway backend C</h1>
    <p>This backend is healthy and listening on port <strong>8082</strong>.</p>
    <p>Route this service through <code>/c/</code> on the edge gateway.</p>
